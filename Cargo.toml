[workspace]
resolver = "2"
members = ["quint-ast", "inquint", "inquint-cli", "inquint-reference"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rustc-hash = "2"
hashbrown = "0.17"
foldhash = "0.2"
thiserror = "2"
itf = "0.3"
clap = { version = "4", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = "thin"
debug = true
